# Tests and builds every push to main and every pull request.
# The build is unsigned (CI has no certificates): it checks that the app
# compiles, not that it can be distributed. Releases are still built and
# signed on the owner's Mac (see CLAUDE.md → Releases).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Third-party action pinned to a full commit SHA (a tag can be moved).
      - name: Select the newest Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Versions
        run: |
          xcodebuild -version
          swift --version

      - name: Test DotFolioKit
        working-directory: Packages/DotFolioKit
        run: swift test

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build the app (unsigned)
        run: |
          xcodebuild -project DotFolio.xcodeproj -scheme DotFolio -configuration Debug \
            -derivedDataPath build/ci \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
